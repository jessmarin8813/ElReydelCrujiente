<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
  <nav>
    <a href="index.php">🧾 Nuevo Pedido</a> |
    <a href="productos.html">🍽️ Agregar Productos</a> |
    <a href="tasa.html">💱 Tasa BCV</a> |

    <a href="perfil.html">🔒 Mi Perfil</a>
  </nav>
  <h2>Agregar producto</h2>
  <form id="form-producto">
    <input type="text" id="nombre" placeholder="Nombre del producto" required>
    <input type="number" id="precio" placeholder="Precio" step="0.01" required>
    <button type="submit">Guardar</button>
  </form>
  <h3>📦 Productos registrados</h3>
  <div id="moduloProductos">
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Precio ($)</th>
          <th>Estado</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody id="tablaProductos"></tbody>
    </table>
  </div>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('form-producto').onsubmit = function (e) {
      e.preventDefault();
      const nombre = document.getElementById('nombre').value;
      const precio = document.getElementById('precio').value;
      fetch('api/agregar_producto.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre, precio })
      })
        .then(res => res.text())
        .then(msg => {
          alert(msg);
          cargarProductos(); // ✅ recarga la tabla después de guardar
        });
    };

    // ✅ carga los productos al abrir la página
    document.addEventListener('DOMContentLoaded', cargarProductos);
  </script>



</body>

</html>
