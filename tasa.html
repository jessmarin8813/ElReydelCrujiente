<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actualizar Tasa BCV</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
  <nav>
    <a href="index.php">🧾 Nuevo Pedido</a> |
    <a href="productos.html">🍽️ Agregar Productos</a> |
    <a href="tasa.html">💱 Tasa BCV</a> |
    <a href="ventas.html">📊 Ventas</a> |
    <a href="deudores.html">⚠️ Deudores</a> |

    <a href="productos_vendidos.html">📦 Productos Vendidos</a> |
    <a href="combos.html">🧃 Combos</a>
  </nav>
  <h2>Actualizar tasa BCV</h2>
  <form id="form-tasa">
    <input type="number" id="tasa" placeholder="Tasa BCV actual" step="0.01" required>
    <button type="submit">Actualizar</button>
  </form>

  <script>
    // 🔹 Mostrar tasa actual al cargar
    fetch('api/tasa.php')
      .then(res => res.json())
      .then(data => {
        const input = document.getElementById('tasa');
        if (input && data.valor) {
          input.value = parseFloat(data.valor).toFixed(2);
        }
      });

    // 🔹 Actualizar tasa al enviar
    document.getElementById('form-tasa').onsubmit = function (e) {
      e.preventDefault();
      const tasa = document.getElementById('tasa').value;
      fetch('api/actualizar_tasa.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tasa })
      })
        .then(res => res.text())
        .then(msg => alert(msg));
    };
  </script>
</body>

</html>
