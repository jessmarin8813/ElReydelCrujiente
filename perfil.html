<div class="profile-container">
        <h2> Cambiar Contraseña</h2>
        <p style="color:#666; margin-bottom:20px;">Por seguridad, ingresa tu Contraseña actual para establecer una
            nueva.</p>

        <form id="formPerfil">
            <label>Contraseña Actual</label>
            <input type="password" id="claveActual" required>

            <label>Nueva Contraseña</label>
            <input type="password" id="claveNueva" required>

            <label>Confirmar Nueva Contraseña</label>
            <input type="password" id="claveConfirmar" required>

            <button type="submit" class="btn-save">Actualizar Contraseña</button>
        </form>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('formPerfil').addEventListener('submit', async (e) => {
            e.preventDefault();
            const actual = document.getElementById('claveActual').value;
            const nueva = document.getElementById('claveNueva').value;
            const confirmar = document.getElementById('claveConfirmar').value;

            if (nueva !== confirmar) {
                alert('Las nuevas contraseñas no coinciden.');
                return;
            }

            if (nueva.length < 4) {
                alert('La contraseña es muy corta (mínimo 4 caracteres).');
                return;
            }

            try {
                const res = await fetch('api/auth.php?action=change_password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ actual, nueva })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    alert('' + data.mensaje);
                    document.getElementById('formPerfil').reset();
                } else {
                    alert(' ' + (data.error || 'Error al actualizar'));
                }
            } catch (err) {
                console.error(err);
                alert('Error de conexión');
            }
        });
    </script>
</body>
